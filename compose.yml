version: "3.8"

services:
  # Frontend: React + Vite + Bun
  web:
    depends_on:
      - api
    build: ./react-frontend
    ports:
      - 5173:5173
    environment:
      VITE_API_URL: http://localhost:3000
    develop:
      watch:
        - path: ./react-frontend/package.json
          action: rebuild
        - path: ./react-frontend/bun.lock
          action: rebuild
        - path: ./react-frontend
          target: /app
          action: sync

  # Backend: Hono + Bun + Drizzle ORM
  api:
    depends_on:
      - db
    build: ./hono-backend
    ports:
      - 3000:3000
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/todo
      PORT: 3000
    develop:
      watch:
        - path: ./hono-backend/package.json
          action: rebuild
        - path: ./hono-backend/bun.lock
          action: rebuild
        - path: ./hono-backend
          target: /app
          action: sync

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - todo_pg_data:/var/lib/postgresql/data

volumes:
  todo_pg_data:
